<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Sanctuary of Style • Alabama</title>
    <style>
        /* RESET & BASE ATMOSPHERE */
        body, html { 
            margin: 0; padding: 0; 
            height: 100%; width: 100%;
            overflow: hidden; /* Lock the screen so we can scroll *inside* the layers */
            font-family: 'Georgia', serif; 
            background: #000; /* Deep black base */
        }

        /* THE INTEGRATED BACKGROUND IMAGE */
        .sanctuary-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            /* Use your specific image link here (ensure a direct image link works) */
            background: url('path-to-your-hosted-image.png') no-repeat center center fixed;
            background-size: cover;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* OVERLAY MAPPING LAYERS */
        .click-layer {
            position: absolute;
            cursor: pointer;
            border: 1px solid transparent; /* Keep it invisible, or use a color to debug placement */
            transition: border 0.3s;
        }
        
        /* Debugging Mode: Uncomment the next line to 'see' where the links are */
        /* .click-layer { border-color: red; } */

        /* 1. Zone: THE WARDROBE (Mapped to the Persian Rug) */
        #zone-wardrobe {
            top: 60%; left: 15%;
            width: 70%; height: 35%;
            z-index: 10;
        }
        #zone-wardrobe:hover { border-color: #d4af37; box-shadow: 0 0 50px rgba(212, 175, 55, 0.4); }

        /* 2. Zone: THE MENAGERIE (Mapped to the Chandelier) */
        #zone-menagerie {
            top: 2%; left: 20%;
            width: 60%; height: 25%;
            z-index: 10;
        }
        #zone-menagerie:hover { border-color: #fff; box-shadow: 0 0 30px rgba(255, 255, 255, 0.3); }

        /* 3. Zone: THE APOTHECARY (Mapped to the Window Glow) */
        #zone-apothecary {
            top: 25%; left: 30%;
            width: 40%; height: 35%;
            z-index: 10;
        }
        #zone-apothecary:hover { border-color: #4a0404; box-shadow: 0 0 30px rgba(74, 4, 4, 0.6); }

        /* 4. Zone: THE ARCHIVE (Mapped to the Wallpaper Sections) */
        #zone-archive {
            top: 35%; left: 5%;
            width: 20%; height: 30%; /* Placement left and right */
            z-index: 10;
        }
        #zone-archive-right { /* Second wallpaper panel */
            top: 35%; left: 75%;
            width: 20%; height: 30%;
            z-index: 10;
        }
        #zone-archive:hover, #zone-archive-right:hover { border-color: #666; }

        /* LINK STYLING (The original navigation remains at the top, over the header) */
        nav { 
            position: fixed; /* Keep original nav floating at the top */
            top: 0; left: 0; width: 100%;
            background: rgba(0, 0, 0, 0.8); 
            padding: 15px; 
            text-align: center; 
            z-index: 200; 
            border-bottom: 2px solid #d4af37;
        }
        nav a { color: #d4af37; text-decoration: none; margin: 0 10px; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px; }

        /* SECTION TITLES & HEADERS (Original Styles) */
        header { 
            position: absolute; top: 10%; width: 100%; text-align: center;
            z-index: 150; pointer-events: none; /* Make header pass-through clicks */
        }
        h1 { font-size: 2.5rem; letter-spacing: 5px; text-transform: uppercase; color: #d4af37; text-shadow: 0px 0px 15px rgba(212, 175, 55, 0.7); }
        .subtitle { font-style: italic; color: #fff; letter-spacing: 1px; opacity: 0.7; }

    </style>
</head>
<body>

    <div class="sanctuary-container">

        <a href="#wardrobe" id="zone-wardrobe" class="click-layer"></a>
        <a href="#menagerie" id="zone-menagerie" class="click-layer"></a>
        <a href="#apothecary" id="zone-apothecary" class="click-layer"></a>
        <a href="#archive" id="zone-archive" class="click-layer"></a>
        <a href="#archive" id="zone-archive-right" class="click-layer"></a>

        <nav>
            <a href="#wardrobe">Wardrobe</a>
            <a href="#treasury">Treasury</a>
            <a href="#apothecary">Apothecary</a>
            <a href="#menagerie">Menagerie</a>
            <a href="#archive">Archive</a>
        </nav>

        <header>
            <h1>The Sanctuary of Style</h1>
            <div class="subtitle">Curated Boutique • Historic Archives • The Apothecary</div>
        </header>

    </div>

    </body>
</html>
